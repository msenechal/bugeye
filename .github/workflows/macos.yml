name: macos

# Tier 1: every target, including AppKit and the adapters, on a GitHub-hosted Mac (free: the repo is
# public). No real capture here: hosted runners can't be granted Screen Recording or Accessibility.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # Ready pull requests to main from branches of this repository only, never drafts (the user's rule,
    # 27 Nov 2026; spec W6); pushes to main and manual runs always.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: xcode-27  # the macos-26 image stops at Xcode 26.6 (spec W2)
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BUGEYE_KEYCHAIN_TESTS: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 27
        run: scripts/select-xcode.sh
      - name: Build
        run: make build
      - name: All tests
        run: make test
      - name: Bundle (ad hoc signed)
        run: make bundle
      - name: Release build has no debug channel
        run: make check-release-symbols
